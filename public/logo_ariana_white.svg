<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="100%" height="100%">
  <defs>
    <!-- CMYK Gradients for swashes -->
    <linearGradient id="yellowSwashW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFED00"/>
      <stop offset="100%" stop-color="#FFC700"/>
    </linearGradient>
    <linearGradient id="magentaSwashW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6007E"/>
      <stop offset="100%" stop-color="#BE006B"/>
    </linearGradient>
    <linearGradient id="cyanSwashW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A0E9"/>
      <stop offset="100%" stop-color="#0072BC"/>
    </linearGradient>

    <filter id="swashGlowW" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(10, 5)">
    <!-- 3 DYNAMIC CMYK BRUSH SWASHES -->
    <path d="M 280,105 C 340,60 480,22 660,18 C 585,32 450,56 295,128 Z" fill="url(#yellowSwashW)" filter="url(#swashGlowW)" />
    <path d="M 305,95 C 375,46 525,18 670,15 C 590,30 440,58 320,118 Z" fill="#FFED00" opacity="0.95" />

    <path d="M 270,155 C 330,110 485,65 690,50 C 595,72 445,108 285,182 Z" fill="url(#magentaSwashW)" filter="url(#swashGlowW)" />
    <path d="M 290,140 C 370,86 545,56 695,48 C 605,68 460,102 310,172 Z" fill="#E6007E" opacity="0.95" />

    <path d="M 335,222 C 385,172 530,118 730,102 C 625,122 475,160 350,255 Z" fill="url(#cyanSwashW)" filter="url(#swashGlowW)" />
    <path d="M 355,202 C 415,148 565,106 740,100 C 640,120 490,155 365,240 Z" fill="#00A0E9" opacity="0.95" />

    <!-- WORD "Gráfica" (Italic elegance in Crisp White) -->
    <text x="175" y="105" font-family="'Plus Jakarta Sans', 'Georgia', serif" font-weight="700" font-style="italic" font-size="54" fill="#FFFFFF" letter-spacing="0.5">Gráfica</text>

    <!-- GIANT INITIAL LETTER 'A' IN CRISP WHITE -->
    <path d="M 25,240 L 132,45 L 188,45 L 158,240 L 122,240 L 134,152 L 72,152 L 58,240 Z M 80,118 L 129,118 L 112,68 Z" fill="#FFFFFF" />

    <!-- REST OF BRAND NAME "R I A N A" IN CRISP WHITE -->
    <text x="180" y="240" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="108" fill="#FFFFFF" letter-spacing="-1">RIANA</text>

    <!-- SUBTITLE "Impressos em Geral" IN CRISP WHITE -->
    <text x="365" y="286" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="34" fill="#E2E8F0" letter-spacing="0">Impressos em Geral</text>

    <!-- TRADEMARK REGISTRATION SYMBOL (R) -->
    <circle cx="735" cy="115" r="13" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <text x="735" y="121" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">R</text>
  </g>
</svg>
