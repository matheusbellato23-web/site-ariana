<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- CMYK Gradients -->
    <linearGradient id="cmykLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A0E9" />
      <stop offset="50%" stop-color="#E6007E" />
      <stop offset="100%" stop-color="#FFED00" />
    </linearGradient>

    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A0E9" />
      <stop offset="100%" stop-color="#E6007E" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <g transform="translate(10, 0)">
    <!-- CMYK Printing Emblem / Overlapping Ink Drops -->
    <g transform="translate(15, 12)" filter="url(#shadow)">
      <!-- Cyan Drop -->
      <circle cx="35" cy="40" r="26" fill="#00A0E9" opacity="0.9" />
      <!-- Magenta Drop -->
      <circle cx="58" cy="40" r="26" fill="#E6007E" opacity="0.85" />
      <!-- Yellow Drop -->
      <circle cx="46.5" cy="62" r="26" fill="#FFED00" opacity="0.85" />
      
      <!-- Key / Registration Crosshair in Center -->
      <circle cx="46.5" cy="47" r="12" fill="none" stroke="#0F172A" stroke-width="3" />
      <circle cx="46.5" cy="47" r="4" fill="#0F172A" />
      <line x1="46.5" y1="30" x2="46.5" y2="64" stroke="#0F172A" stroke-width="2.5" />
      <line x1="29.5" y1="47" x2="63.5" y2="47" stroke="#0F172A" stroke-width="2.5" />
    </g>

    <!-- Brand Text -->
    <!-- "GRÁFICA" -->
    <text x="120" y="58" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="36" 
          font-weight="900" 
          fill="#0F172A" 
          letter-spacing="2">
      GRÁFICA
    </text>

    <!-- "ARIANA" -->
    <text x="298" y="58" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="36" 
          font-weight="900" 
          fill="url(#brandGradient)" 
          letter-spacing="2">
      ARIANA
    </text>

    <!-- CMYK Accent Bar -->
    <rect x="120" y="70" width="370" height="4" rx="2" fill="url(#cmykLine)" />

    <!-- Subtitle: IMPRESSOS EM GERAL -->
    <text x="121" y="93" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="12" 
          font-weight="700" 
          fill="#475569" 
          letter-spacing="4">
      SOLUÇÕES EM IMPRESSOS EM GERAL
    </text>
  </g>
</svg>